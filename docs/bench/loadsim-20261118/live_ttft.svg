<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Time to first token for live coaching questions under five scheduling policies</title>
<desc id="d">Median first-token latency per 10-second window while 300 clock-triggered background jobs compete with live questions at 0.7 per second on one Intel Arc Pro B70. First-come-first-served makes live questions wait 14 to 185 seconds; prioritizing or pacing keeps them near 0.3 to 1 second.</desc>
