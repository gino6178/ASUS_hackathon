<!doctype html>
<html><head><meta charset="utf-8"><title>End card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1920px; height: 1080px; background: #04070A; color: #EEF1F2; font: 400 24px/1.4 "Segoe UI", sans-serif; overflow: hidden; display: grid; place-items: center; }
  .wrap { text-align: center; }
  .tag { font: 600 20px/1 Consolas, monospace; letter-spacing: 8px; color: #F2E6C9; text-transform: uppercase; opacity: 0; animation: in .8s .2s forwards; }
  h1 { font: 700 150px/0.95 Bahnschrift, sans-serif; letter-spacing: 10px; margin: 34px 0 30px; opacity: 0; animation: in 1s .5s forwards; }
  p { font-size: 34px; color: #C3CACD; opacity: 0; animation: in 1s 1.3s forwards; }
  .pills { display: flex; gap: 18px; justify-content: center; margin-top: 54px; }
  .pills span { opacity: 0; animation: in .7s forwards; } .b1 { animation-delay: 2.0s !important; } .b2 { animation-delay: 2.6s !important; } .b3 { animation-delay: 3.2s !important; }
  .pills span { border: 2px solid #3A444A; border-radius: 12px; padding: 14px 28px; font: 600 26px/1 "Segoe UI", sans-serif; background: #0B1217; }
  .pills span.hi { border-color: #5FD39A; color: #5FD39A; }
  .foot { position: absolute; top: 64px; left: 0; right: 0; text-align: center; font: 28px Consolas, monospace; color: #C3CACD; opacity: 0; animation: in 1s 3s forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
</style></head>
<body>
<div class="wrap">
  <div class="tag">ASUS UGen AI League 2026 · Battlefield Thunderstorm</div>
  <h1>SHUTTLECOACH</h1>
  <p>A coaching staff that keeps learning, and never leaves your court.</p>
  <div class="pills"><span class="hi b1">100% local processing</span><span class="b2">Multi-agent round table</span><span class="b3">Built for Intel Arc Pro B70 · 32 GB</span></div>
</div>
<div class="foot">Team rm-rf-2 · github.com/gino6178/ASUS_hackathon</div>
</body></html>
